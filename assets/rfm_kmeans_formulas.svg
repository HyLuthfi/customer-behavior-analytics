<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="100%" height="100%" style="background-color: #0d1117; border-radius: 14px; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="rfmGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="normGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="kmeansGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas Outer Border -->
  <rect x="1" y="1" width="1078" height="558" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />

  <!-- Title & Subtitle Header -->
  <text x="540" y="42" text-anchor="middle" font-size="20" font-weight="800" fill="url(#headerGrad)" letter-spacing="0.5">
    MATHEMATICAL FOUNDATION: RFM &amp; K-MEANS CLUSTERING
  </text>
  <text x="540" y="66" text-anchor="middle" font-size="12" font-weight="500" fill="#8b949e">
    Formal Algorithmic Formulations for Behavioral Feature Extraction, Vector Scaling &amp; Unsupervised Optimization
  </text>

  <!-- ========================================================================= -->
  <!-- CARD 1: RFM FEATURE FORMULATION -->
  <!-- ========================================================================= -->
  <g transform="translate(30, 90)" filter="url(#cardShadow)">
    <rect width="320" height="435" rx="10" fill="url(#rfmGrad)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="320" height="3" fill="#34d399" />
    
    <rect x="16" y="14" width="75" height="18" rx="4" fill="#065f46" />
    <text x="53" y="27" text-anchor="middle" font-size="10" font-weight="700" fill="#d1fae5">PIPELINE 1</text>
    <text x="16" y="52" font-size="16" font-weight="700" fill="#f0f6fc">RFM Engine</text>
    <text x="16" y="68" font-size="11" font-weight="500" fill="#34d399">Recency · Frequency · Monetary</text>
    <text x="16" y="83" font-size="10" font-weight="400" fill="#8b949e">Ekstraksi Perilaku Transaksi Ritel</text>
    <line x1="16" y1="94" x2="304" y2="94" stroke="#1e293b" stroke-width="1" />

    <!-- 1. Recency -->
    <text x="16" y="114" font-size="11" font-weight="700" fill="#94a3b8">1. RECENCY (R) — Kedekatan Waktu</text>
    <rect x="16" y="122" width="288" height="46" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <g transform="translate(26, 150)">
      <text x="0" y="0" font-size="12" font-weight="600" fill="#34d399" font-family="'Courier New', monospace">R<tspan font-size="8" dy="2">i</tspan><tspan font-size="12" dy="-2"> = (T</tspan><tspan font-size="8" dy="2">ref</tspan><tspan font-size="12" dy="-2"> − max(T</tspan><tspan font-size="8" dy="2">i</tspan><tspan font-size="12" dy="-2">)) dalam hari</tspan></text>
    </g>

    <!-- 2. Frequency -->
    <text x="16" y="188" font-size="11" font-weight="700" fill="#94a3b8">2. FREQUENCY (F) — Frekuensi Belanja</text>
    <rect x="16" y="196" width="288" height="46" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <g transform="translate(26, 224)">
      <text x="0" y="0" font-size="12" font-weight="600" fill="#38bdf8" font-family="'Courier New', monospace">F<tspan font-size="8" dy="2">i</tspan><tspan font-size="12" dy="-2"> = count_distinct(InvoiceNo</tspan><tspan font-size="8" dy="2">i</tspan><tspan font-size="12" dy="-2">)</tspan></text>
    </g>

    <!-- 3. Monetary -->
    <text x="16" y="262" font-size="11" font-weight="700" fill="#94a3b8">3. MONETARY (M) — Nilai Belanja</text>
    <rect x="16" y="270" width="288" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <g transform="translate(26, 298)">
      <text x="0" y="8" font-size="12" font-weight="600" fill="#f0f6fc" font-family="'Courier New', monospace">M<tspan font-size="8" dy="2">i</tspan><tspan font-size="12" dy="-2"> = </tspan><tspan font-size="16" fill="#f59e0b">∑</tspan> (Quantity<tspan font-size="8" dy="2">k</tspan><tspan font-size="12" dy="-2"> × UnitPrice</tspan><tspan font-size="8" dy="2">k</tspan><tspan font-size="12" dy="-2">)</tspan></text>
    </g>

    <!-- Karakteristik -->
    <text x="16" y="352" font-size="11" font-weight="700" fill="#94a3b8">SPESIFIKASI BISNIS</text>
    <rect x="16" y="360" width="288" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <g transform="translate(26, 378)" font-size="9.5" fill="#8b949e">
      <text y="0">• T_ref = max(InvoiceDate) + 1 hari</text>
      <text y="16">• Mengeliminasi data refund (Quantity &lt;= 0)</text>
      <text y="32">• Membentuk matriks awal X berdimensi N × 3</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- CARD 2: MINMAXSCALER NORMALIZATION -->
  <!-- ========================================================================= -->
  <g transform="translate(380, 90)" filter="url(#cardShadow)">
    <rect width="320" height="435" rx="10" fill="url(#normGrad)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="320" height="3" fill="#38bdf8" />
    
    <rect x="16" y="14" width="75" height="18" rx="4" fill="#0369a1" />
    <text x="53" y="27" text-anchor="middle" font-size="10" font-weight="700" fill="#e0f2fe">PIPELINE 2</text>
    <text x="16" y="52" font-size="16" font-weight="700" fill="#f0f6fc">Feature Scaling</text>
    <text x="16" y="68" font-size="11" font-weight="500" fill="#38bdf8">MinMaxScaler Normalization</text>
    <text x="16" y="83" font-size="10" font-weight="400" fill="#8b949e">Eliminasi Dominasi Skala Moneter</text>
    <line x1="16" y1="94" x2="304" y2="94" stroke="#1e293b" stroke-width="1" />

    <!-- 1. Formula Normalisasi -->
    <text x="16" y="114" font-size="11" font-weight="700" fill="#94a3b8">1. TRANSFORMASI SKALA [0, 1]</text>
    <rect x="16" y="122" width="288" height="88" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    
    <g transform="translate(32, 138)">
      <text x="0" y="32" font-size="14" font-weight="600" fill="#f0f6fc" font-family="'Courier New', monospace">x<tspan font-size="9" dy="2">scaled</tspan><tspan font-size="14" dy="-2"> =</tspan></text>
      <!-- Fraction -->
      <g transform="translate(76, 6)">
        <text x="65" y="14" text-anchor="middle" font-size="13" font-weight="600" fill="#38bdf8" font-family="'Courier New', monospace">x − x<tspan font-size="8" dy="2">min</tspan></text>
        <line x1="0" y1="23" x2="130" y2="23" stroke="#f0f6fc" stroke-width="1.2" />
        <text x="65" y="40" text-anchor="middle" font-size="13" font-weight="600" fill="#f0f6fc" font-family="'Courier New', monospace">x<tspan font-size="8" dy="2">max</tspan><tspan font-size="13" dy="-2"> − x</tspan><tspan font-size="8" dy="2">min</tspan></text>
      </g>
    </g>

    <!-- 2. Vektor Normalisasi -->
    <text x="16" y="230" font-size="11" font-weight="700" fill="#94a3b8">2. VEKTOR FITUR TERNORMALISASI</text>
    <rect x="16" y="238" width="288" height="92" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <g transform="translate(24, 258)" font-size="11" font-family="'Courier New', monospace" fill="#c9d1d9">
      <text y="0">• R_norm ∈ [0.0, 1.0]</text>
      <text y="22">• F_norm ∈ [0.0, 1.0]</text>
      <text y="44">• M_norm ∈ [0.0, 1.0]</text>
      <text y="64" fill="#34d399" font-size="10">✓ Bobot jarak Euclidean seimbang</text>
    </g>

    <!-- Karakteristik -->
    <text x="16" y="352" font-size="11" font-weight="700" fill="#94a3b8">URGENSI ALGORITMA</text>
    <rect x="16" y="360" width="288" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <g transform="translate(26, 378)" font-size="9.5" fill="#8b949e">
      <text y="0">• Monetary (£ribuan) menenggelamkan Recency</text>
      <text y="16">• Tanpa scaling: K-Means hanya klasterisasi M</text>
      <text y="32">• MinMaxScaler menjaga distribusi spasial 3D</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- CARD 3: K-MEANS CLUSTERING OBJECTIVE -->
  <!-- ========================================================================= -->
  <g transform="translate(730, 90)" filter="url(#cardShadow)">
    <rect width="320" height="435" rx="10" fill="url(#kmeansGrad)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="320" height="3" fill="#a78bfa" />
    
    <rect x="16" y="14" width="75" height="18" rx="4" fill="#5b21b6" />
    <text x="53" y="27" text-anchor="middle" font-size="10" font-weight="700" fill="#ede9fe">PIPELINE 3</text>
    <text x="16" y="52" font-size="16" font-weight="700" fill="#f0f6fc">K-Means Engine</text>
    <text x="16" y="68" font-size="11" font-weight="500" fill="#a78bfa">Unsupervised Clustering Core</text>
    <text x="16" y="83" font-size="10" font-weight="400" fill="#8b949e">Minimasi Within-Cluster Variance</text>
    <line x1="16" y1="94" x2="304" y2="94" stroke="#1e293b" stroke-width="1" />

    <!-- 1. WCSS Function -->
    <text x="16" y="114" font-size="11" font-weight="700" fill="#94a3b8">1. FUNGSI OBJEKTIF WCSS (INERTIA)</text>
    <rect x="16" y="122" width="288" height="74" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <g transform="translate(24, 142)">
      <text x="0" y="26" font-size="14" font-weight="700" fill="#a78bfa" font-family="'Courier New', monospace">J =</text>
      <!-- Double Sigma -->
      <g transform="translate(36, 6)">
        <text x="10" y="20" font-size="20" fill="#f0f6fc">∑</text>
        <text x="10" y="2" text-anchor="middle" font-size="8" fill="#94a3b8">k</text>
        <text x="10" y="30" text-anchor="middle" font-size="8" fill="#94a3b8">j=1</text>
        
        <text x="32" y="20" font-size="20" fill="#f0f6fc">∑</text>
        <text x="32" y="30" text-anchor="middle" font-size="7" fill="#94a3b8">x_i ∈ S_j</text>
      </g>
      <text x="96" y="26" font-size="13" font-weight="600" fill="#f0f6fc" font-family="'Courier New', monospace">‖x<tspan font-size="8" dy="2">i</tspan><tspan font-size="13" dy="-2"> − μ</tspan><tspan font-size="8" dy="2">j</tspan><tspan font-size="13" dy="-2">‖²</tspan></text>
    </g>

    <!-- 2. Centroid Update -->
    <text x="16" y="216" font-size="11" font-weight="700" fill="#94a3b8">2. PEMBARUAN SENTROID ITERATIF (μj)</text>
    <rect x="16" y="224" width="288" height="72" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <g transform="translate(34, 238)">
      <text x="0" y="26" font-size="13" font-weight="600" fill="#f0f6fc" font-family="'Courier New', monospace">μ<tspan font-size="8" dy="2">j</tspan><tspan font-size="13" dy="-2"> = </tspan></text>
      <!-- Fraction -->
      <g transform="translate(38, 2)">
        <text x="24" y="13" text-anchor="middle" font-size="12" fill="#c084fc">1</text>
        <line x1="0" y1="20" x2="48" y2="20" stroke="#f0f6fc" stroke-width="1.2" />
        <text x="24" y="34" text-anchor="middle" font-size="11" font-weight="600" fill="#f0f6fc" font-family="'Courier New', monospace">|S<tspan font-size="8" dy="2">j</tspan><tspan font-size="11" dy="-2">|</tspan></text>
      </g>
      <g transform="translate(98, 2)">
        <text x="10" y="24" font-size="20" fill="#f0f6fc">∑</text>
        <text x="10" y="34" text-anchor="middle" font-size="7" fill="#94a3b8">x_i ∈ S_j</text>
      </g>
      <text x="132" y="26" font-size="13" font-weight="600" fill="#a78bfa" font-family="'Courier New', monospace">x<tspan font-size="8" dy="2">i</tspan></text>
    </g>

    <!-- Karakteristik -->
    <text x="16" y="318" font-size="11" font-weight="700" fill="#94a3b8">3. SPESIFIKASI ALGORITMA</text>
    <rect x="16" y="326" width="288" height="94" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <g transform="translate(26, 344)" font-size="9.5" fill="#c9d1d9">
      <text y="0"><tspan font-weight="700" fill="#f0f6fc">Jumlah Klaster:</tspan> k = 3 Segmen Mutlak</text>
      <text y="16"><tspan font-weight="700" fill="#f0f6fc">Inisialisasi:</tspan> k-means++ (Anti local minima)</text>
      <text y="32"><tspan font-weight="700" fill="#f0f6fc">Konvergensi:</tspan> n_init=10, random_state=42</text>
      <text y="48"><tspan font-weight="700" fill="#f0f6fc">Hasil:</tspan> High-Value, Medium-Value, Low-Value</text>
      <text y="64" fill="#a78bfa" font-weight="600">Visual: Proyeksi 3D Scatter Space Plotly</text>
    </g>
  </g>
</svg>
